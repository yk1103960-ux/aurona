name: Locate original Active eCommerce source

on:
  push:
    branches:
      - codex/phase-2a-admin
    paths:
      - .github/workflows/restore-active-ecommerce.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-2a-admin
          fetch-depth: 0

      - name: Download newer Hostinger backup
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check gdown
          mkdir -p /tmp/aurona-newer
          cd /tmp/aurona-newer
          gdown '1grQ5qPj0BGUa2Em8P3mqOKqe2sredXPV' -O aurona-2026.tar.gz
          test -s aurona-2026.tar.gz
          ls -lh aurona-2026.tar.gz

      - name: Scan archive for Laravel roots
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/aurona-newer/aurona-2026.tar.gz
          mkdir -p active-ecommerce
          set +o pipefail
          tar -tzf "$ARCHIVE" | grep -E '(^|/)(artisan|composer\.json|routes/admin\.php|routes/wholesale\.php)$' | head -500 > active-ecommerce/NEWER_BACKUP_LARAVEL_PATHS.txt
          set -o pipefail
          cat active-ecommerce/NEWER_BACKUP_LARAVEL_PATHS.txt
          if ! grep -E '(^|/)artisan$' active-ecommerce/NEWER_BACKUP_LARAVEL_PATHS.txt >/dev/null; then
            echo 'No Laravel artisan file found in newer backup.' >&2
            exit 1
          fi

      - name: Commit scan manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add active-ecommerce/NEWER_BACKUP_LARAVEL_PATHS.txt
          git commit -m 'scan newer backup for original Laravel Active eCommerce source'
          git push origin HEAD:codex/phase-2a-admin
